version: "3.8"

services:
    redis-stack:
        image: redis/redis-stack:latest
        container_name: redis-stack
        ports:
            - "127.0.0.1:6379:6379"
            - "127.0.0.1:8001:8001"
        volumes:
            - ./redis-stack.conf:/usr/local/etc/redis/redis-stack.conf:ro
            - ./redis-data:/data
        command: ["redis-stack-server", "/usr/local/etc/redis/redis-stack.conf"]
        restart: unless-stopped